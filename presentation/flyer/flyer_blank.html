<title>歴史の宮殿 ワークショップ（背景のみ）</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

  :root{
    --paper:#faf6ee;
    --paper-2:#f1e9d9;
    --ink:#2a2019;
    --ink-soft:#4a3c2e;
    --ember:#c9622e;
    --ember-deep:#8f431e;
    --muted:#8a7a63;
    --line: rgba(42,32,25,0.16);
  }

  *{box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:40px 16px 64px;
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  }

  @page{ size:A4; margin:0; }

  .serif{ font-family:"Shippori Mincho","Hiragino Mincho ProN",serif; }

  .poster{
    width:100%;
    max-width:640px;
    aspect-ratio:210/297;
    background:var(--paper);
    border:1px solid var(--line);
    position:relative;
    z-index:0;
  }
  .poster::before{
    content:"";
    position:absolute; inset:10px;
    border:1px solid rgba(42,32,25,0.10);
    pointer-events:none;
  }

  /* ---- hero ring ---- */
  .hero{
    position:absolute;
    left:50%; top:30%;
    width:36%; aspect-ratio:1/1;
    transform:translate(-50%,-50%);
  }
  .ring-ticks{
    position:absolute; inset:0;
    border-radius:50%;
    background: repeating-conic-gradient(from 0deg, var(--muted) 0deg 1.1deg, transparent 1.1deg 15deg);
    -webkit-mask-image: radial-gradient(circle, transparent 0 63%, black 63.5% 68%, transparent 68.5% 100%);
    mask-image: radial-gradient(circle, transparent 0 63%, black 63.5% 68%, transparent 68.5% 100%);
    opacity:.6;
  }
  .ring-line{
    position:absolute; inset:6%;
    border-radius:50%;
    border:1px solid rgba(201,98,46,0.4);
  }
  .event-dot{
    position:absolute; left:50%; top:50%;
    width:7px; height:7px; margin:-3.5px 0 0 -3.5px;
    border-radius:50%;
    background:var(--ember);
  }
  .figure{
    position:absolute; left:50%; top:50%;
    width:28%; height:39%;
    transform:translate(-50%,-58%);
  }
  .figure svg{ width:100%; height:100%; overflow:visible; }

  @media print{
    html, body{
      width:210mm; height:297mm;
      padding:0; margin:0;
      background:var(--paper);
      overflow:hidden;
    }
    .poster{
      width:210mm; height:297mm;
      max-width:none;
      aspect-ratio:auto;
      border:none;
      overflow:hidden;
    }
  }
</style>

  <div class="hero">
    <div class="ring-ticks"></div>
    <div class="ring-line"></div>
    <div class="event-dot" style="transform:rotate(18deg) translateY(-44%);"></div>
