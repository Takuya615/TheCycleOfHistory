<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>歴史の宮殿</title>
<style>
  /* ---------- palettes ---------- */
  /* default (data-palette="amber"): warm charcoal-brown, softer than the old near-black */
  :root{
    --void:#2a221b;
    --void-2:#332a21;
    --instrument:#8c7a64;
    --instrument-dim:#544636;
    --ember:#e8975a;
    --ember-dim:#8a5530;
    --skin:#ede1d3;
    --skin-2:#e2d2be;
    --ink:#241b14;
    --muted:#b3a48f;
    --muted-warm:#c9b696;
  }
  html[data-palette="midnight"]{
    --void:#161210;
    --void-2:#1e1815;
    --instrument:#6b5f52;
    --instrument-dim:#3a322a;
    --ember:#e08850;
    --ember-dim:#7a4a2c;
    --muted:#9c9086;
    --muted-warm:#a89a86;
  }
  html[data-palette="limestone"]{
    --void:#403a33;
    --void-2:#4a433b;
    --instrument:#a89a89;
    --instrument-dim:#6d6156;
    --ember:#c97a4a;
    --ember-dim:#8f5836;
    --muted:#c4b8a9;
    --muted-warm:#d4c4ac;
  }
  html[data-palette="indigo"]{
    --void:#181d2a;
    --void-2:#212838;
    --instrument:#5f6b85;
    --instrument-dim:#333c52;
    --ember:#d9a45a;
    --ember-dim:#8a6a38;
    --muted:#8b93a6;
    --muted-warm:#a89a86;
  }
  html[data-palette="chalk-pink"]{
    --void:#16302a;
    --void-2:#1c3a32;
    --instrument:#e6efe9;
    --instrument-dim:#3f5b4e;
    --ember:#e8829c;
    --ember-dim:#a8607a;
    --muted:#eef2ef;
    --muted-warm:#f0c9d6;
  }
  html[data-palette="chalk-yellow"]{
    --void:#16302a;
    --void-2:#1c3a32;
    --instrument:#e6efe9;
    --instrument-dim:#3f5b4e;
    --ember:#e8c85a;
    --ember-dim:#a68a3c;
    --muted:#eef2ef;
    --muted-warm:#f0e0a8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;height:100%;
    background:var(--void);
    color:var(--skin);
    font-family:"Hiragino Mincho ProN","YuMincho","Georgia",serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  .tech{
    font-family:"Hiragino Kaku Gothic ProN","Avenir Next","YuGothic","Segoe UI",sans-serif;
  }
  #app{
    position:fixed;inset:0;
    background:
      radial-gradient(120% 90% at 50% 18%, var(--void-2) 0%, var(--void) 60%);
  }

  /* ---------- screens ---------- */
  .screen{
    position:absolute;inset:0;
    display:none;flex-direction:column;
  }
  .screen.active{display:flex;}

  header{
    flex:0 0 auto;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 6px;
    text-align:center;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:.32em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .headline{
    margin-top:10px;font-size:17px;color:var(--skin);letter-spacing:.03em;
  }

  /* ---------- ring screen ---------- */
  .stage{
    position:relative;
    flex:1 1 auto;
    display:flex;align-items:center;justify-content:center;
    min-height:0;
  }
  .stage svg{
    width:min(92vw, 82vh, 460px);
    height:min(92vw, 82vh, 460px);
    overflow:visible;
  }
  .ring{fill:none;stroke:var(--instrument);stroke-width:1;opacity:.55;}
  .ring-fill{fill:#fff;}
  .body-silhouette{opacity:1;}
  .body-silhouette circle{fill:var(--instrument-dim);}
  .body-silhouette line{stroke:var(--instrument-dim);stroke-width:34;stroke-linecap:round;}
  .body-silhouette line.body-torso{stroke-width:51;}
  .tick{stroke:var(--instrument-dim);stroke-width:1;}
  .cluster-dot{fill:var(--ember);stroke:var(--void);stroke-width:2;}
  .cluster-count{
    fill:var(--void);font-size:18px;font-weight:700;
    text-anchor:middle;dominant-baseline:central;pointer-events:none;user-select:none;
  }
  .century-tick{stroke:var(--instrument);stroke-width:1.5;opacity:.6;}
  .century-spoke{stroke:var(--instrument-dim);stroke-width:1;opacity:.3;}
  .tick-label{fill:var(--muted);font-size:19px;text-anchor:middle;dominant-baseline:middle;}
  .event-year-label{
    fill:var(--muted-warm);font-size:13px;letter-spacing:.02em;
    text-anchor:middle;dominant-baseline:middle;pointer-events:none;
  }
  .node-hit{fill:transparent;cursor:pointer;}
  .node-dot{
    fill:var(--instrument);
    stroke:var(--void);
    stroke-width:2;
    transition:fill .45s ease, r .3s ease;
    animation:breathe 4.5s ease-in-out infinite;
  }
  .node-dot.visited{fill:var(--ember-dim);}
  .node-dot.active{fill:var(--ember);}
  .node-glow{
    fill:var(--ember);
    opacity:0;
    transform-origin:center;
    transform:scale(.3);
    transition:opacity .45s ease, transform .45s ease;
    filter:blur(6px);
  }
  .node-glow.active{opacity:.85;transform:scale(1);}
  .node-icon{
    font-size:26px;pointer-events:none;user-select:none;
    transition:font-size .3s ease;
  }
  @keyframes breathe{
    0%,100%{opacity:.75;} 50%{opacity:1;}
  }
  @media (prefers-reduced-motion: reduce){
    .node-dot{animation:none;}
  }

  .center-label{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    text-align:center;pointer-events:none;
    padding:10px 30px;
    background:rgba(255,255,255,.85);
    border-radius:14px;
  }
  .center-label.is-empty{background:none;padding:0;}
  .center-label .hint{
    font-size:14px;color:var(--ink);letter-spacing:.04em;opacity:.6;
  }

  .fab-wrap{
    flex:0 0 auto;
    display:flex;justify-content:center;
    padding:0 20px calc(env(safe-area-inset-bottom,0px) + 26px);
  }
  .fab{
    appearance:none;border:1px solid var(--ember-dim);
    background:var(--ember-dim);color:var(--skin);
    font-family:inherit;font-size:16px;letter-spacing:.1em;
    padding:14px 34px;border-radius:999px;cursor:pointer;
    box-shadow:0 8px 24px rgba(224,136,80,.18);
    transition:transform .2s ease, background .2s ease;
  }
  .fab:active{transform:scale(.96);}
  .fab.tech{font-family:"Hiragino Kaku Gothic ProN","Avenir Next",sans-serif;}

  /* ---------- theme select screen ---------- */
  .theme-list{
    flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 100px);
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
  }
  .theme-card{
    border:1px solid var(--instrument-dim);
    border-radius:14px;padding:16px 14px;
    background:var(--void-2);cursor:pointer;
    transition:border-color .2s ease, background .2s ease;
  }
  .theme-card.selected{
    border-color:var(--ember);background:rgba(224,136,80,.12);
  }
  .theme-card .t-name{font-size:16px;color:var(--skin);}
  .theme-card .t-cat{margin-top:6px;font-size:10.5px;color:var(--muted);letter-spacing:.06em;}
  .theme-card .t-sense{margin-top:4px;font-size:10.5px;color:var(--muted-warm);letter-spacing:.03em;}
  .theme-card .t-check{
    float:right;width:16px;height:16px;border-radius:50%;
    border:1px solid var(--instrument);
  }
  .theme-card.selected .t-check{background:var(--ember);border-color:var(--ember);}

  .bottom-bar{
    flex:0 0 auto;padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 20px);
    display:flex;justify-content:center;gap:10px;
  }
  .primary-btn{
    appearance:none;border:none;flex:1 1 auto;max-width:230px;
    background:var(--instrument-dim);color:var(--muted);
    font-family:inherit;font-size:16px;letter-spacing:.1em;
    padding:14px;border-radius:999px;cursor:not-allowed;
    transition:background .2s ease, color .2s ease;
  }
  .primary-btn.enabled{
    background:var(--ember-dim);color:var(--skin);cursor:pointer;
  }
  .primary-btn.tech{font-family:"Hiragino Kaku Gothic ProN","Avenir Next",sans-serif;}
  .secondary-btn{
    appearance:none;flex:0 0 auto;max-width:120px;
    background:transparent;border:1px solid var(--instrument-dim);color:var(--muted);
    font-family:inherit;font-size:16px;letter-spacing:.1em;
    padding:14px 20px;border-radius:999px;cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
  }
  .secondary-btn:active{border-color:var(--instrument);}
  .secondary-btn.tech{font-family:"Hiragino Kaku Gothic ProN","Avenir Next",sans-serif;}

  /* ---------- pickup screen (2枚から1枚選ぶデュエル方式) ---------- */
  .dots{flex:0 0 auto;display:flex;justify-content:center;gap:7px;padding:12px 20px 0;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--instrument-dim);transition:background .3s ease;}
  .dot.filled{background:var(--ember);}
  .dot.current{background:var(--ember-dim);}

  .duel-stage{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:row;align-items:center;justify-content:center;
    gap:clamp(8px,3vw,16px);overflow-x:auto;-webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
    padding:14px clamp(10px,4vw,20px) calc(env(safe-area-inset-bottom,0px) + 20px);
    cursor:grab;
  }
  .duel-stage:active{cursor:grabbing;}

  .duel-card{
    /* flex:1 1 0 lets both cards share the row equally, shrinking on narrow
       phones so neither needs a horizontal scroll to be seen; max-width caps
       how wide a single (odd-round) card can grow on larger screens. */
    flex:1 1 0;min-width:0;max-width:300px;max-height:100%;
    scroll-snap-align:center;
    background:linear-gradient(180deg, var(--skin) 0%, var(--skin-2) 100%);
    color:var(--ink);border-radius:20px;
    box-shadow:0 16px 40px rgba(0,0,0,.4);
    padding:clamp(12px,4vw,20px);overflow-y:auto;-webkit-overflow-scrolling:touch;
    cursor:pointer;user-select:none;
    border:3px solid transparent;
    transition:border-color .2s ease, transform .15s ease, box-shadow .2s ease;
    font-family:"Hiragino Kaku Gothic ProN","Avenir Next","YuGothic",sans-serif;
  }
  .duel-card:active{
    border-color:var(--ember);
    transform:scale(.97);
  }
  @keyframes duelCardEnter{
    from{opacity:0;transform:translateY(14px) scale(.96);}
    to{opacity:1;transform:none;}
  }
  .duel-card-enter{animation:duelCardEnter .4s cubic-bezier(.19,1,.22,1);}

  .card-year{font-size:13px;letter-spacing:.12em;color:var(--ember-dim);}
  .card-title{font-size:19px;font-weight:600;margin:5px 0 10px;line-height:1.5;}
  .card-teaser{font-size:16px;line-height:1.75;color:#4a3d30;margin-bottom:12px;}
  .card-place{font-size:13px;color:var(--muted-warm);margin-bottom:12px;}
  .card-fact{font-size:15px;line-height:1.75;color:#4a3d30;border-top:1px solid rgba(36,27,20,.15);padding-top:12px;}
  .card-portrait{
    display:block;width:56px;height:56px;border-radius:50%;
    object-fit:cover;margin:0 auto 12px;
    border:1px solid rgba(36,27,20,.15);
  }
  .card-portrait-lg{width:clamp(64px,26vw,128px);height:clamp(64px,26vw,128px);margin:0 auto 14px;}
  .card-name-year{font-size:clamp(17px,5vw,20px);font-weight:600;line-height:1.4;color:var(--ink);}
  .card-mnemonic-label{font-size:12px;letter-spacing:.14em;color:var(--ember-dim);margin-top:14px;}
  .card-mnemonic-content{font-size:clamp(16px,4.8vw,19px);font-weight:700;line-height:1.5;color:var(--ink);margin-top:2px;}

  /* ---------- scrim + sheet (event detail) ---------- */
  .scrim{
    position:fixed;inset:0;background:rgba(6,8,9,.6);
    opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:10;
  }
  .scrim.show{opacity:1;pointer-events:auto;}

  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:11;
    max-height:76vh;
    background:linear-gradient(180deg, var(--skin) 0%, var(--skin-2) 100%);
    color:var(--ink);
    border-radius:22px 22px 0 0;
    box-shadow:0 -20px 50px rgba(0,0,0,.4);
    transform:translateY(106%);
    transition:transform .45s cubic-bezier(.19,1,.22,1);
    padding:10px 26px calc(env(safe-area-inset-bottom,0px) + 26px);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{
    width:38px;height:4px;border-radius:2px;
    background:rgba(36,27,20,.25);
    margin:6px auto 18px;
  }
  .detail-eyebrow{
    font-family:"Hiragino Kaku Gothic ProN","Avenir Next",sans-serif;
    font-size:14px;letter-spacing:.14em;color:var(--ember-dim);
  }
  .detail-teaser{
    font-size:22px;line-height:1.55;margin:6px 0 8px;color:var(--ink);
  }
  .detail-person{
    display:flex;align-items:center;gap:12px;
    margin:8px 0 8px;
  }
  .detail-person-name{font-size:23px;line-height:1.4;color:var(--ink);font-weight:600;}
  .detail-relic{
    font-size:16px;line-height:1.6;color:var(--ink);margin:0 0 10px;
  }
  .detail-mnemonic{
    font-size:16px;line-height:1.7;color:var(--ember-dim);font-style:italic;
    margin:-2px 0 14px;
  }
  .detail-portrait{
    display:block;width:128px;height:128px;border-radius:50%;
    object-fit:cover;margin:6px auto 18px;
    border:1px solid rgba(36,27,20,.15);
  }
  .detail-place{
    font-family:"Hiragino Kaku Gothic ProN","Avenir Next",sans-serif;
    font-size:13px;color:var(--ink);letter-spacing:.03em;margin-bottom:16px;
  }
  .detail-body p{
    margin:0 0 16px;font-size:16px;line-height:1.85;
    opacity:0;transform:translateY(6px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .sheet.open .detail-body p{opacity:1;transform:none;}
  .sheet.open .detail-body p:nth-child(1){transition-delay:.06s;}
  .sheet.open .detail-body p:nth-child(2){transition-delay:.14s;}
  .sheet.open .detail-body p:nth-child(3){transition-delay:.22s;}
  .sheet.open .detail-body p:nth-child(4){transition-delay:.3s;}
  .detail-body .tag{
    display:block;font-family:"Hiragino Kaku Gothic ProN","Avenir Next",sans-serif;
    font-size:12px;letter-spacing:.18em;
    color:var(--ember-dim);margin-bottom:5px;
  }
  .delete-btn{
    appearance:none;border:1px solid rgba(176,80,63,.4);background:transparent;
    color:#a3543f;font-family:"Hiragino Kaku Gothic ProN",sans-serif;
    font-size:14px;letter-spacing:.06em;padding:10px 18px;border-radius:999px;
    margin-top:6px;cursor:pointer;display:block;width:100%;
  }

  /* ---------- settings (palette picker) ---------- */
  .settings-btn{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;z-index:25;
    width:36px;height:36px;border-radius:50%;
    border:1px solid var(--instrument-dim);background:var(--void-2);color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    font-size:19px;cursor:pointer;appearance:none;
    transition:border-color .2s ease, transform .2s ease;
  }
  .settings-btn:active{transform:scale(.92);}
  .settings-panel{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);right:16px;z-index:25;
    background:var(--void-2);border:1px solid var(--instrument-dim);border-radius:14px;
    padding:12px;display:none;flex-direction:column;gap:4px;min-width:200px;
    box-shadow:0 16px 40px rgba(0,0,0,.45);
  }
  .settings-panel.open{display:flex;}
  .settings-panel .s-title{
    font-size:12px;letter-spacing:.14em;color:var(--muted);
    padding:2px 8px 8px;
  }
  .palette-option{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;
    cursor:pointer;border:1px solid transparent;background:none;width:100%;text-align:left;
    font-family:inherit;
  }
  .palette-option:hover{border-color:var(--instrument-dim);}
  .palette-option.active{border-color:var(--ember);background:rgba(224,136,80,.1);}
  .palette-swatch{
    width:20px;height:20px;border-radius:50%;flex:0 0 auto;
    border:1px solid rgba(255,255,255,.15);
  }
  .palette-option .p-name{font-size:15px;color:var(--skin);}
  .settings-panel .s-divider{height:1px;background:var(--instrument-dim);margin:6px 4px;}
  .palette-option.s-danger .p-name{color:#c06a52;}
  .palette-option.s-danger:hover{border-color:rgba(176,80,63,.4);}

  /* ---------- onboarding (初回ウォークスルー) ---------- */
  .onboard-scrim{
    position:fixed;inset:0;z-index:40;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    background:
      radial-gradient(120% 90% at 50% 18%, var(--void-2) 0%, var(--void) 60%);
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
  }
  .onboard-scrim.show{opacity:1;pointer-events:auto;}
  .onboard-card{
    position:relative;width:min(88vw,380px);max-height:86vh;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg, var(--skin) 0%, var(--skin-2) 100%);
    color:var(--ink);border-radius:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    padding:20px 24px calc(env(safe-area-inset-bottom,0px) + 22px);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .onboard-skip{
    position:absolute;top:16px;right:16px;
    appearance:none;border:none;background:none;cursor:pointer;
    font-size:13px;letter-spacing:.06em;color:var(--muted-warm);
    padding:6px 8px;
  }
  .onboard-illust{
    height:180px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    margin:18px 0 6px;
  }
  .onboard-illust img{max-width:100%;max-height:100%;object-fit:contain;}
  .onboard-eyebrow{
    font-size:13px;letter-spacing:.14em;color:var(--ember-dim);text-align:center;
    margin-bottom:8px;
  }
  .onboard-title{
    font-size:22px;line-height:1.5;color:var(--ink);text-align:center;
    margin:8px 0 4px;
  }
  .onboard-body{
    font-size:16px;line-height:1.85;color:var(--ink);text-align:center;
    margin:0 0 6px;
  }
  .onboard-dots{padding-top:6px;}
  .onboard-nav{
    flex:0 0 auto;padding-top:16px;
    display:flex;justify-content:center;gap:10px;
  }

  /* ---------- coachmark (操作ガイド・スポットライト) ---------- */
  .coach-overlay{
    position:fixed;inset:0;z-index:20;
    pointer-events:none;
    opacity:0;transition:opacity .3s ease;
  }
  .coach-overlay.show{opacity:1;}
  .coach-overlay.tap-anywhere.show{pointer-events:auto;}
  .coach-ring{
    position:absolute;pointer-events:none;
    border:2px solid var(--ember);
    box-shadow:0 0 0 3000px rgba(6,8,9,.6), 0 0 26px rgba(224,136,80,.55);
    transition:left .35s ease, top .35s ease, width .35s ease, height .35s ease;
    animation:coachPulse 1.8s ease-in-out infinite;
  }
  @keyframes coachPulse{
    0%,100%{box-shadow:0 0 0 3000px rgba(6,8,9,.6), 0 0 18px rgba(224,136,80,.4);}
    50%{box-shadow:0 0 0 3000px rgba(6,8,9,.6), 0 0 30px rgba(224,136,80,.75);}
  }
  .coach-tip{
    position:absolute;max-width:min(72vw,260px);
    background:linear-gradient(180deg, var(--skin) 0%, var(--skin-2) 100%);
    color:var(--ink);border-radius:16px;
    padding:14px 16px 12px;
    box-shadow:0 14px 36px rgba(0,0,0,.4);
    /* pointer-events only enabled while the overlay is actually shown (below) —
       otherwise this absolutely-positioned tip is invisible (opacity:0 on the
       ancestor) but was still intercepting taps wherever it was last placed,
       even on later screens, since pointer-events doesn't follow opacity. */
    pointer-events:none;
  }
  .coach-overlay.show .coach-tip{pointer-events:auto;}
  .coach-text{font-size:16px;line-height:1.75;margin-bottom:8px;}
  .coach-dismiss{
    appearance:none;border:none;background:none;cursor:pointer;
    font-family:inherit;font-size:13px;letter-spacing:.06em;
    color:var(--ember-dim);padding:0;display:block;margin-left:auto;
  }

  /* ---------- level badge (ring screen header) ---------- */
  .level-badge{
    margin-top:8px;font-size:13px;color:var(--muted-warm);letter-spacing:.05em;
  }

  /* ---------- fab: quiz mode ---------- */
  .fab.fab-quiz{
    background:linear-gradient(135deg, var(--ember) 0%, var(--ember-dim) 100%);
    border-color:var(--ember);
    animation:fabPulse 2.2s ease-in-out infinite;
  }
  @keyframes fabPulse{
    0%,100%{box-shadow:0 8px 24px rgba(224,136,80,.18);}
    50%{box-shadow:0 8px 30px rgba(224,136,80,.42);}
  }


  /* ---------- ring: newly-added highlight ---------- */
  .node-dot.new-highlight{animation:newHighlight 1.5s ease-in-out;}
  @keyframes newHighlight{
    0%,100%{filter:none;}
    30%,70%{filter:drop-shadow(0 0 6px var(--ember));}
  }
  .node-glow.new-highlight{opacity:.9;}

  /* ---------- quiz screen ---------- */
  .quiz-stage{
    flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
    padding:14px 20px;
    overflow-y:auto; /* ヒントを開いてカードが画面をはみ出す場合は縦スクロールできるようにする（2026-09-25追加） */

  }

  .quiz-hint-btn{
    appearance:none;border:none;background:none;color:var(--ember-dim);

  .quiz-hint-btn.open .quiz-hint-arrow{transform:rotate(180deg);}

    max-height:0;overflow:hidden;

    font-size:15px;line-height:1.7;color:var(--ember-dim);font-style:italic;

  }
  @keyframes quizCardEnter{
    from{opacity:0;transform:translateY(18px) rotate(-3deg) scale(.94);}
    to{opacity:1;transform:none;}

  .quiz-card-enter{animation:quizCardEnter .45s cubic-bezier(.19,1,.22,1);}

  .quiz-choices{
    flex:0 0 auto;display:flex;flex-direction:column;gap:10px;
    padding:0 20px calc(env(safe-area-inset-bottom,0px) + 26px);
  }
  .quiz-choice-btn{
    appearance:none;border:1px solid var(--instrument-dim);background:var(--void-2);
    color:var(--skin);font-family:"Hiragino Kaku Gothic ProN","Avenir Next",sans-serif;
    font-size:16px;letter-spacing:.04em;
    padding:14px 18px;border-radius:14px;cursor:pointer;text-align:left;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .quiz-choice-btn:active{transform:scale(.97);border-color:var(--ember);background:rgba(224,136,80,.14);}

  /* ---------- quiz result screen ---------- */
  .quiz-result-wrap{
    flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:28px;padding:20px;
  }
  .quiz-result-card{
    position:relative;width:min(80vw,300px);padding:44px 24px;border-radius:22px;
    background:linear-gradient(180deg, var(--skin) 0%, var(--skin-2) 100%);
    color:var(--ink);text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.4);
    overflow:visible;transition:box-shadow .4s ease;
  }
  .quiz-result-level{
    font-size:24px;font-weight:700;letter-spacing:.04em;color:var(--ember-dim);
    margin-bottom:10px;
    opacity:0;transform:translateY(6px);transition:opacity .5s ease, transform .5s ease;
  }
  .quiz-result-card.fail .quiz-result-level{color:var(--muted);}
  .quiz-result-score{font-size:38px;font-weight:600;letter-spacing:.04em;}
  .quiz-result-title{
    margin-top:14px;font-size:17px;letter-spacing:.04em;color:var(--ember-dim);
    font-family:"Hiragino Kaku Gothic ProN","Avenir Next",sans-serif;
    opacity:0;transform:translateY(6px);transition:opacity .5s ease, transform .5s ease;
  }
  .quiz-result-title strong{font-weight:700;}
  .quiz-result-note{
    margin-top:18px;font-size:14px;line-height:1.7;color:var(--ember-dim);
    font-family:"Hiragino Kaku Gothic ProN","Avenir Next",sans-serif;
    opacity:0;transform:translateY(6px);transition:opacity .5s ease, transform .5s ease;
  }
  .quiz-result-card.fail .quiz-result-note{color:var(--muted);}
  .quiz-result-card.revealed .quiz-result-level,
  .quiz-result-card.revealed .quiz-result-title,
  .quiz-result-card.revealed .quiz-result-note{opacity:1;transform:none;}
  .quiz-result-card.pass{box-shadow:0 16px 46px rgba(224,136,80,.4);}
  .quiz-result-particle{
    position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;
    background:var(--ember);opacity:0;pointer-events:none;
  }
  @keyframes particleBurst{
    0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) translate(var(--px), var(--py)) scale(.4);}
  }
  .quiz-result-particle.burst{animation:particleBurst .9s ease-out forwards;}

  ::-webkit-scrollbar{display:none;}
</style>
</head>

<script>
/* ==================================================================
   data layer
   ================================================================== */
const RING_KEY = 'rekishiNoKyuden.ringList.v1';
let THEMES = [];                  // data/themes.json
const eventCache = new Map();     // themeId -> event[]
let ringList = [];                // [{id, addedAt}]

function loadRingList(){
  try{
    const raw = localStorage.getItem(RING_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveRingList(){
  try{ localStorage.setItem(RING_KEY, JSON.stringify(ringList)); }catch(e){}
}

/* ---------- level / 称号 (service_design_document.md 10-3節) ---------- */
const LEVEL_KEY = 'rekishiNoKyuden.level.v1';
const LEVEL_TABLE = [
  { level: 1,  cap: 3,  title: '記憶の見習い' },
  { level: 2,  cap: 4,  title: '円環の観察者' },
  { level: 3,  cap: 5,  title: '円環の探求者' },
  { level: 4,  cap: 7,  title: '時の道筋を辿る者' },
  { level: 5,  cap: 10, title: '記憶の織り手' },
  { level: 6,  cap: 11, title: '歴史の旅人' },
  { level: 7,  cap: 13, title: '円環の案内人' },
  { level: 8,  cap: 14, title: '記憶の番人' },
  { level: 9,  cap: 17, title: '時の目撃者' },
  { level: 10, cap: 18, title: '歴史の編纂者' },
  { level: 11, cap: 20, title: '円環の賢者' },
  { level: 12, cap: 21, title: '記憶の継承者' },
  { level: 13, cap: 23, title: '時代を渡る者' },
  { level: 14, cap: 24, title: '歴史の守護者' },
  { level: 15, cap: 26, title: '宮殿の主' }
];
let playerLevel = 1;

function getLevelInfo(level){
  const clamped = Math.min(Math.max(level, 1), LEVEL_TABLE.length);
  return LEVEL_TABLE[clamped - 1];
}
function loadPlayerLevel(){
  try{
    const v = parseInt(localStorage.getItem(LEVEL_KEY), 10);
    return (v >= 1 && v <= LEVEL_TABLE.length) ? v : 1;
  }catch(e){ return 1; }
}
function savePlayerLevel(){
  try{ localStorage.setItem(LEVEL_KEY, String(playerLevel)); }catch(e){}
}
// 円環リストの件数が現在のレベルの上限を上回っている場合（旧データ等）、
// レベルを保有件数に見合うところまで引き上げる（レベルは下げない）。
function reconcileLevelWithHeldCount(heldCount){
  let lvl = playerLevel;
  while (lvl < LEVEL_TABLE.length && getLevelInfo(lvl).cap < heldCount) lvl += 1;
  if (lvl !== playerLevel){
    playerLevel = lvl;
    savePlayerLevel();
  }
}

async function loadThemes(){
  const res = await fetch('data/themes.json');
  THEMES = await res.json();
}

async function fetchEventsForTheme(themeId){
  if (eventCache.has(themeId)) return eventCache.get(themeId);
  try{
    const res = await fetch(`data/events/events_${themeId}.json`);
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    eventCache.set(themeId, data);
    return data;
  }catch(e){
    console.warn('events not available for theme', themeId, e);
    eventCache.set(themeId, []);
    return [];
  }
}

function themeIdFromEventId(eventId){
  return eventId.split('-')[0];
}

async function resolveRingEvents(){
  const themeIds = [...new Set(ringList.map(r => themeIdFromEventId(r.id)))];
  await Promise.all(themeIds.map(fetchEventsForTheme));
  const lookup = new Map();
  themeIds.forEach(t => (eventCache.get(t) || []).forEach(e => lookup.set(e.id, e)));
  return ringList
    .map(r => lookup.get(r.id))
    .filter(Boolean)
    .sort((a, b) => a.year - b.year);
}

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ==================================================================
   screen switching
   ================================================================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ==================================================================
   settings — palette picker
   ================================================================== */
const PALETTE_KEY = 'rekishiNoKyuden.palette.v1';
const PALETTES = [
  { id: 'amber',       name: '琥珀の余韻', void: '#2a221b', ember: '#e8975a' },
  { id: 'midnight',    name: '深夜の書斎', void: '#161210', ember: '#e08850' },
  { id: 'limestone',   name: '石灰岩の回廊', void: '#403a33', ember: '#c97a4a' },
  { id: 'indigo',      name: '藍色の残響', void: '#181d2a', ember: '#d9a45a' },
  { id: 'chalk-pink',  name: '黒板（桃色チョーク）', void: '#16302a', ember: '#e8829c' },
  { id: 'chalk-yellow', name: '黒板（黄色チョーク）', void: '#16302a', ember: '#e8c85a' }
];

function loadPalette(){
  try{ return localStorage.getItem(PALETTE_KEY) || 'amber'; }
  catch(e){ return 'amber'; }
}

function applyPalette(id){
  document.documentElement.setAttribute('data-palette', id);
  try{ localStorage.setItem(PALETTE_KEY, id); }catch(e){}
  renderPaletteList(id);
}

function renderPaletteList(activeId){
  const list = document.getElementById('paletteList');
  list.innerHTML = '';
  PALETTES.forEach(p => {
    const opt = document.createElement('button');
    opt.className = 'palette-option' + (p.id === activeId ? ' active' : '');
    opt.innerHTML = `
      <span class="palette-swatch" style="background:linear-gradient(135deg, ${p.void} 50%, ${p.ember} 50%)"></span>
      <span class="p-name">${p.name}</span>
    `;
    opt.addEventListener('click', () => {
      applyPalette(p.id);
      document.getElementById('settingsPanel').classList.remove('open');
    });
    list.appendChild(opt);
  });
}

document.getElementById('settingsBtn').addEventListener('click', () => {
  document.getElementById('settingsPanel').classList.toggle('open');
});

/* ==================================================================
   初回オンボーディング（ウォークスルー・カルーセル）
   ================================================================== */
const ONBOARD_KEY = 'rekishiNoKyuden.onboarded.v1';

const ONBOARD_SLIDES = [
  {
    title: 'ようこそ',
    body: 'このアプリは、記憶力のテクニックを駆使して、歴史を覚えよう！というアプリです。'
  },
  {
    img: 'image/onboarding/step1.png',
    body: 'ただ並べただけの情報は、おぼえづらいものです。'
  },
  {
    img: 'image/onboarding/step2.png',
    body: 'まずは、円状に並べてみましょう。'
  },
  {
    img: 'image/onboarding/step3.png',
    body: 'それぞれの位置に、イメージを置いていきます。'
  },
  {
    img: 'image/onboarding/step4.png',
    body: '円の中心に、自分の身体を置いてみます。'
  },
  {
    img: 'image/onboarding/step5.png',
    body: '身体に覚えたいものを乗せるイメージを持ちます。記憶が定着しやすくなります！'
  },
  {
    img: 'image/onboarding/step6.png',
    body: '歴史も同じです！ 1500〜2000年を円状に割り当ててみます。'
  },
  {
    img: 'image/onboarding/step7.png',
    body: '好きな偉人や歴史を年代にそっておきます。'
  },
  {
    img: 'image/onboarding/step8.png',
    body: '円にそって身体にのせるイメージを作ると完成！！'
  },
  {
    title: '歴史の宮殿',
    body: 'さあ、はじめてみましょう。',
    cta: 'はじめる'
  }
];

let onboardIndex = 0;

function hasOnboarded(){
  try{ return localStorage.getItem(ONBOARD_KEY) === '1'; }
  catch(e){ return true; }
}
function markOnboarded(){
  try{ localStorage.setItem(ONBOARD_KEY, '1'); }catch(e){}
}

function renderOnboardSlide(){
  const s = ONBOARD_SLIDES[onboardIndex];

  const eyebrowEl = document.getElementById('onboardEyebrow');
  eyebrowEl.textContent = s.eyebrow || '';
  eyebrowEl.style.display = s.eyebrow ? '' : 'none';

  const titleEl = document.getElementById('onboardTitle');
  titleEl.textContent = s.title || '';
  titleEl.style.display = s.title ? '' : 'none';

  document.getElementById('onboardBody').textContent = s.body;

  const illust = document.getElementById('onboardIllust');
  illust.innerHTML = '';
  illust.style.display = s.img ? '' : 'none';
  if (s.img){
    const img = document.createElement('img');
    img.src = s.img;
    img.alt = '';
    illust.appendChild(img);
  }

  const dots = document.getElementById('onboardDots');
  dots.innerHTML = '';
  ONBOARD_SLIDES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i < onboardIndex ? ' filled' : i === onboardIndex ? ' current' : '');
    dots.appendChild(d);
  });

  document.getElementById('onboardBackBtn').style.visibility = onboardIndex === 0 ? 'hidden' : 'visible';
  document.getElementById('onboardNextBtn').textContent = s.cta || '次へ';
}

function openOnboarding(){
  onboardIndex = 0;
  renderOnboardSlide();
  document.getElementById('onboardScrim').classList.add('show');
}
function closeOnboarding(){
  document.getElementById('onboardScrim').classList.remove('show');
  markOnboarded();
  maybeShowFabCoachmark();
}

document.getElementById('onboardNextBtn').addEventListener('click', () => {
  if (onboardIndex >= ONBOARD_SLIDES.length - 1){
    closeOnboarding();
  } else {
    onboardIndex += 1;
    renderOnboardSlide();
  }
});
document.getElementById('onboardBackBtn').addEventListener('click', () => {
  if (onboardIndex > 0){
    onboardIndex -= 1;
    renderOnboardSlide();
  }
});
document.getElementById('onboardSkipBtn').addEventListener('click', closeOnboarding);

document.getElementById('replayOnboardBtn').addEventListener('click', () => {
  document.getElementById('settingsPanel').classList.remove('open');
  openOnboarding();
});

document.getElementById('resetDataBtn').addEventListener('click', () => {
  const ok = confirm('円環に記憶した出来事・レベルなど、すべてのデータをリセットします。よろしいですか？');
  if (!ok) return;
  try{
    localStorage.removeItem(RING_KEY);
    localStorage.removeItem(LEVEL_KEY);
    localStorage.removeItem(ONBOARD_KEY);
    localStorage.removeItem(COACH_KEY);
  }catch(e){}
  location.reload();
});

/* ==================================================================
   コーチマーク（操作ガイド・スポットライト）
   ================================================================== */
const COACH_KEY = 'rekishiNoKyuden.coachSeen.v1';

function loadCoachSeen(){
  try{
    const raw = localStorage.getItem(COACH_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function hasSeenCoach(id){
  return !!loadCoachSeen()[id];
}
function markCoachSeen(id){
  try{
    const seen = loadCoachSeen();
    seen[id] = true;
    localStorage.setItem(COACH_KEY, JSON.stringify(seen));
  }catch(e){}
}

let coachActiveTarget = null;
let coachActivePlacement = 'top';
let coachTapAnywhere = false;
let coachQueue = [];

function positionCoachmark(){
  if (!coachActiveTarget || !document.body.contains(coachActiveTarget)) return;
  const rect = coachActiveTarget.getBoundingClientRect();
  const pad = 10;
  const ring = document.getElementById('coachRing');
  const isRound = coachActiveTarget.tagName === 'circle' ||
    getComputedStyle(coachActiveTarget).borderRadius === '50%';
  ring.style.borderRadius = isRound ? '50%' : '16px';
  ring.style.left = (rect.left - pad) + 'px';
  ring.style.top = (rect.top - pad) + 'px';
  ring.style.width = (rect.width + pad * 2) + 'px';
  ring.style.height = (rect.height + pad * 2) + 'px';

  const tip = document.getElementById('coachTip');
  const tipRect = tip.getBoundingClientRect();
  let top = coachActivePlacement === 'top'
    ? rect.top - pad - tipRect.height - 14
    : rect.bottom + pad + 14;
  top = Math.max(12, Math.min(top, window.innerHeight - tipRect.height - 12));
  let left = rect.left + rect.width / 2 - tipRect.width / 2;
  left = Math.max(16, Math.min(left, window.innerWidth - tipRect.width - 16));
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

// 複数ステップを順番に見せたいときは startCoachSequence([...])、
// 単発なら steps を1つだけ渡す。tapAnywhere を立てたステップは、
// ハイライト部分を含む画面のどこをタップしても次へ進む（＝実際の
// ボタン操作を素通りさせない）。
function showNextCoachmark(){
  const overlay = document.getElementById('coachOverlay');
  if (!coachQueue.length){
    overlay.classList.remove('show', 'tap-anywhere');
    coachActiveTarget = null;
    return;
  }
  const step = coachQueue.shift();
  if (!step.target || !document.body.contains(step.target)){
    showNextCoachmark();
    return;
  }
  coachActiveTarget = step.target;
  coachActivePlacement = step.placement || 'top';
  coachTapAnywhere = !!step.tapAnywhere;
  const textEl = document.getElementById('coachText');
  if (step.html) textEl.innerHTML = step.text;
  else textEl.textContent = step.text;
  overlay.classList.toggle('tap-anywhere', coachTapAnywhere);
  overlay.classList.add('show');
  positionCoachmark();
}
function startCoachSequence(steps){
  coachQueue = steps.filter(s => s.target);
  showNextCoachmark();
}
function advanceCoachmark(){
  showNextCoachmark();
}
function hideCoachmark(){
  coachQueue = [];
  document.getElementById('coachOverlay').classList.remove('show', 'tap-anywhere');
  coachActiveTarget = null;
}
document.getElementById('coachDismissBtn').addEventListener('click', (e) => {

});
document.getElementById('coachOverlay').addEventListener('click', () => {

});

/* ==================================================================
   Screen 1 — 円環UI画面
   ================================================================== */
const YEAR_MIN = 1500, YEAR_MAX = 2000;
const CX = 280, CY = 280, R = 200;
const svg = document.getElementById('dial');
const NS = "http://www.w3.org/2000/svg";

function angleForYear(y){
  return (y - YEAR_MIN) / (YEAR_MAX - YEAR_MIN) * 360;
}
function pointOnRing(deg, radius){
  const rad = (deg - 90) * Math.PI / 180;
  return { x: CX + radius * Math.cos(rad), y: CY + radius * Math.sin(rad) };
}
function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

let ringEventsCache = [];
// 重なったノードのクラスターのうち、現在タップで展開しているものの識別キー
// （メンバーのidをつないだ文字列）。nullなら何も展開していない（2026-09-25追加）。
let expandedClusterKey = null;

function buildBodySilhouette(){
  // A deliberately generic, unlabeled ピクトグラム, inscribed loosely within the
  // ring. It's meant only as ambient texture suggesting "a body sits behind this
  // circle" — it must never label or imply which exact point maps to which exact
  // joint; that mapping stays entirely up to the user's imagination. Arms are
  // simple straight horizontal segments (a plain 大の字 sideways reach) rather than
  // pointing toward any specific ring position.
  const g = el('g', {class:'body-silhouette'});
  // Proportions modeled loosely after simplified pictogram figures (restroom/DOT
  // signage style): head ≈ 1 unit, torso ≈ 1.2 head-diameters, legs the longest
  // segment.
  // NECK_GAP is measured from the torso line's actual coordinate, but the line's
  // round cap (stroke-linecap:round) visually bulges another half-stroke-width
  // (25.5px, since the torso is drawn 1.5x thicker than the limbs — see
  // .body-torso below) past that point — so the gap has to clear that bulge
  // too, or the head circle looks fused onto the torso instead of floating
  // above it.
  const HEAD_R = 26, NECK_GAP = 40, TORSO_LEN = 62, ARM_LEN = 140;
  const navelY = CY; // おへそ（胴体の下端）を円環の中心に合わせる
  const torsoTop = navelY - TORSO_LEN;
  const headCY = torsoTop - NECK_GAP - HEAD_R;
  const shoulderY = torsoTop; // 腕は肩（胴体の最上部）から出す
  const LIMB_REACH = R - 20; // leg tips stay clear of the ring's edge

  const leftHand = { x: CX - ARM_LEN, y: shoulderY };
  const rightHand = { x: CX + ARM_LEN, y: shoulderY };
  // Leg tips: same splay angle as before, scaled in from the ring line to LIMB_REACH.
  const legScale = LIMB_REACH / Math.hypot(115, 175);
  const legDX = 115 * legScale, legDY = 175 * legScale;

  g.appendChild(el('circle', {cx:CX, cy:headCY, r:HEAD_R}));                                                     // head
  g.appendChild(el('line', {x1:CX, y1:torsoTop, x2:CX, y2:navelY, class:'body-torso'}));                         // torso
  g.appendChild(el('line', {x1:CX, y1:shoulderY, x2:leftHand.x, y2:leftHand.y}));                                // left arm, straight out
  g.appendChild(el('line', {x1:CX, y1:shoulderY, x2:rightHand.x, y2:rightHand.y}));                              // right arm, straight out
  g.appendChild(el('line', {x1:CX, y1:navelY, x2:CX - legDX, y2:CY + legDY}));                                   // left leg
  g.appendChild(el('line', {x1:CX, y1:navelY, x2:CX + legDX, y2:CY + legDY}));                                   // right leg
  return g;
}

// 円環上の出来事ノード1件分の描画（単独ノード・クラスター展開後のメンバー、
// どちらからも呼ばれる共通処理、2026-09-25切り出し）。
function renderRingNode(ev, p, deg, nodeRadius){
  const hasIcon = !!ev.icon;
  const glow = el('circle', {cx:p.x, cy:p.y, r: hasIcon ? 30 : 22, class:'node-glow', 'data-id':ev.id});
  const hit  = el('circle', {cx:p.x, cy:p.y, r: hasIcon ? 32 : 26, class:'node-hit', 'data-id':ev.id});
  const dot  = el('circle', {cx:p.x, cy:p.y, r: hasIcon ? 20 : 6, class:'node-dot', 'data-id':ev.id});
  hit.addEventListener('click', (e) => {
    e.stopPropagation();
    openDetailSheet(ev);
  });
  svg.appendChild(glow);
  svg.appendChild(dot);
  if (hasIcon){
    const icon = el('text', {x:p.x, y:p.y, class:'node-icon', 'data-id':ev.id, 'text-anchor':'middle', 'dominant-baseline':'central'});
    icon.textContent = ev.icon;
    svg.appendChild(icon);
  }
  svg.appendChild(hit);

  const yp = pointOnRing(deg, nodeRadius + (hasIcon ? 30 : 14));
  const yearLabel = el('text', {x:yp.x, y:yp.y, class:'event-year-label'});
  yearLabel.textContent = ev.year;
  svg.appendChild(yearLabel);
}

// クラスター展開中に円環の背景（ノード・クラスターバッジ以外の場所）をタップ
// したら、展開を閉じてまとめ表示に戻す（2026-09-25追加）。ノード・バッジ側の
// クリックハンドラーはstopPropagation()しているため、ここには「それ以外の
// 場所」をタップした場合だけ届く。
svg.addEventListener('click', () => {
  if (expandedClusterKey !== null){
    expandedClusterKey = null;
    renderRing();
  }
});

let fabMode = 'pickup';

async function renderRing(){
  const centerLabel = document.getElementById('ringCenterLabel');
  const fab = document.getElementById('fabBtn');

  ringEventsCache = await resolveRingEvents();
  reconcileLevelWithHeldCount(ringEventsCache.length);
  const levelInfo = getLevelInfo(playerLevel);
  document.getElementById('levelBadge').textContent =
    `Lv.${playerLevel}・${levelInfo.title}（${ringEventsCache.length}/${levelInfo.cap}）`;

  svg.innerHTML = '';
  svg.appendChild(el('circle', {cx:CX, cy:CY, r:R, class:'ring-fill'}));
  svg.appendChild(buildBodySilhouette());
  svg.appendChild(el('circle', {cx:CX, cy:CY, r:R, class:'ring'}));
  for (let year = 1500; year < 2000; year += 100){
    const deg = angleForYear(year);
    const spokeInner = pointOnRing(deg, 40);
    const spokeOuter = pointOnRing(deg, R - 14);
    svg.appendChild(el('line', {x1:spokeInner.x, y1:spokeInner.y, x2:spokeOuter.x, y2:spokeOuter.y, class:'century-spoke'}));
    const p1 = pointOnRing(deg, R - 14);
    const p2 = pointOnRing(deg, R + 14);
    svg.appendChild(el('line', {x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, class:'century-tick'}));
    const lp = pointOnRing(deg, R + 34);
    const label = el('text', {x:lp.x, y:lp.y, class:'tick-label', 'data-year':year});
    label.textContent = year;
    svg.appendChild(label);
  }

  // 近接した出来事は「クラスター」としてまとめ、2件以上重なる場合はタップで
  // 展開する件数バッジとして表示する（2026-09-25追加：旧仕様は常時・小刻みな
  // 放射オフセットのみでタップ判定同士が重なりやすかったための改善）。
  // EXPANDED_MAX_EXTRA：展開時、円環の枠線からどこまで外側に広げてよいかの上限
  // （SVGのviewBox上、円環の外側にはこれくらいしか余白がないため）。
  // メンバー数で割った間隔で並べることで、何件重なっていても表示が画面の
  // 外まで飛び出さないようにする（間隔は狭くなるが、極端に多い場合の妥協）。
  const MIN_GAP_DEG = 9, EXPANDED_MAX_EXTRA = 90;
  const clusters = [];
  let lastDeg = null;
  ringEventsCache.forEach((ev) => {
    const deg = angleForYear(ev.year);
    const last = clusters[clusters.length - 1];
    // 直前の出来事との角度差で連鎖判定する（隣同士が近ければ、3件以上でも
    // ひとつながりのクラスターにまとめる。クラスターの先頭要素だけと比較すると、
    // 隣接するのに別クラスターとして扱われ、バッジ同士がほぼ重なって表示される
    // 不具合になる）。
    if (last && lastDeg !== null && Math.min(Math.abs(deg - lastDeg), 360 - Math.abs(deg - lastDeg)) < MIN_GAP_DEG){
      last.members.push(ev);
    } else {
      clusters.push({ members: [ev] });
    }
    lastDeg = deg;
  });
  // クラスターの代表角度は、描画確定後にメンバー全体の平均角度として求める
  // （表示位置・展開時の扇の起点に使う）。
  clusters.forEach(c => {
    c.deg = c.members.reduce((sum, m) => sum + angleForYear(m.year), 0) / c.members.length;
  });

  clusters.forEach(({ deg, members }) => {
    const base = pointOnRing(deg, R);

    if (members.length === 1){
      renderRingNode(members[0], base, deg, R);
      return;
    }

    const clusterKey = members.map(m => m.id).join('|');
    if (expandedClusterKey === clusterKey){
      // 純粋に同じ角度のまま放射方向だけへ並べると、3件以上では間隔が狭くなり
      // すぎてタップ判定がほぼ重なってしまう（画面外にはみ出さない上限
      // EXPANDED_MAX_EXTRA の中に収めなければならないため）。そこで放射方向を
      // 主としつつ、外側のメンバーほど角度も少しだけ振ることで、限られた面積の
      // 中でも実際に指で区別しやすい間隔を確保する。
      const step = EXPANDED_MAX_EXTRA / members.length;
      const ANGLE_JITTER = 7;
      const mid = (members.length - 1) / 2;
      members.forEach((ev, i) => {
        const nodeRadius = R + step * (i + 1);
        const nodeDeg = deg + ANGLE_JITTER * (i - mid);
        const p = pointOnRing(nodeDeg, nodeRadius);
        svg.appendChild(el('line', {x1:base.x, y1:base.y, x2:p.x, y2:p.y, class:'tick'}));
        renderRingNode(ev, p, nodeDeg, nodeRadius);
      });
    } else {
      const dot = el('circle', {cx:base.x, cy:base.y, r:22, class:'node-dot cluster-dot'});
      const hit = el('circle', {cx:base.x, cy:base.y, r:30, class:'node-hit'});
      const count = el('text', {x:base.x, y:base.y, class:'cluster-count'});
      count.textContent = members.length;
      hit.addEventListener('click', (e) => {
        e.stopPropagation();
        expandedClusterKey = clusterKey;
        renderRing();
      });
      svg.appendChild(dot);
      svg.appendChild(count);
      svg.appendChild(hit);
    }
  });

  if (ringEventsCache.length === 0){
    centerLabel.innerHTML = '';
    centerLabel.classList.add('is-empty');
  } else {
    centerLabel.innerHTML = `<div class="hint">触れて、感じてください</div>`;
    centerLabel.classList.remove('is-empty');
  }

  if (ringEventsCache.length >= levelInfo.cap){
    fabMode = 'quiz';
    fab.textContent = 'クイズに挑戦';
    fab.classList.add('fab-quiz');
  } else {
    fabMode = 'pickup';
    fab.textContent = ringEventsCache.length === 0 ? '作成' : '追加';
    fab.classList.remove('fab-quiz');
  }
}

document.getElementById('fabBtn').addEventListener('click', () => {
  hideCoachmark();
  if (fabMode === 'quiz') startQuiz();
  else startPickup();
});

/* ==================================================================
   Screen 3 — 歴史ピックアップ画面（2026-09-23：2枚から1枚選ぶデュエル方式）
   候補全体からランダムに2枚（残り1枚のときは1枚）を提示し、どちらかを
   タップして選ぶ。これをレベルの保有上限に達するまで繰り返し、最後に
   まとめて円環リストへ反映してホーム（円環UI画面）に戻る。
   ================================================================== */
const DEMO_THEME_IDS = ['greatman']; // デモ表示は「超有名な偉人」16人で行う

let duelPickup = { pool: [], sessionPicks: [], round: 0, totalRounds: 0 };

// iconReasonは「羅針盤 🧭：世界一周という航海の軌跡が...」のように、アイコンの
// 日本語名＋絵文字＋説明という形式で書かれている。先頭の日本語名だけを取り出し、
// 「<アイテム名>の<人物名>」というピックアップカード用の愛称を組み立てる。
// iconReasonは「羅針盤 🧭：世界一周という航海の軌跡が...」のように、アイコンの
// 日本語名＋絵文字＋説明という形式で書かれている。先頭の日本語名だけを取り出す。
function iconItemLabel(ev){
  const label = (ev.iconReason || '').split('：')[0].replace(ev.icon || '', '').trim();
  return label || ev.title;
}

function renderPickupCard(ev){
  return (ev.before !== undefined) ? `
    ${ev.portrait ? `<img class="card-portrait card-portrait-lg" src="${ev.portrait}" alt="${ev.title}">` : ''}
    <div class="card-name-year">${ev.title}（${ev.year}年）</div>
    <div class="card-mnemonic-label tech">覚え方</div>
    <div class="card-mnemonic-content">${ev.icon || ''} ${iconItemLabel(ev)}・${ev.bodyPart}</div>
  ` : `
    <div class="card-year tech">${ev.year}年 &middot; ${ev.place}</div>
    <div class="card-title">${ev.title}</div>
    <div class="card-teaser">${ev.teaser}</div>
    <div class="card-fact">${ev.factLayer}</div>
  `;
}

async function startPickup(){
  await Promise.all(DEMO_THEME_IDS.map(fetchEventsForTheme));
  const ringIds = new Set(ringList.map(r => r.id));
  const candidates = DEMO_THEME_IDS
    .flatMap(t => eventCache.get(t) || [])
    .filter(e => !ringIds.has(e.id));

  const remainingSlots = Math.max(0, getLevelInfo(playerLevel).cap - ringList.length);
  const totalRounds = Math.min(remainingSlots, candidates.length);

  duelPickup = { pool: candidates, sessionPicks: [], round: 0, totalRounds };
  showScreen('screen-pickup');
  renderPickupRound();
  maybeShowPickupCoachmark();
}

function renderPickupRound(){
  if (duelPickup.round >= duelPickup.totalRounds){
    finishCenturyPickup();
    return;
  }

  const pickedIds = new Set(duelPickup.sessionPicks.map(ev => ev.id));
  const available = duelPickup.pool.filter(ev => !pickedIds.has(ev.id));
  const options = shuffle(available).slice(0, Math.min(2, available.length));

  document.getElementById('pickupEyebrow').textContent = `${duelPickup.round + 1} / ${duelPickup.totalRounds}`;
  document.getElementById('pickupHeadline').textContent =
    options.length > 1 ? 'どちらの歴史を記憶する？' : 'この歴史を記憶する';

  const dots = document.getElementById('pickupDots');
  dots.innerHTML = '';
  for (let i = 0; i < duelPickup.totalRounds; i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i < duelPickup.round ? ' filled' : i === duelPickup.round ? ' current' : '');
    dots.appendChild(d);
  }

  const stage = document.getElementById('pickupStage');
  stage.innerHTML = '';
  options.forEach((ev) => {
    const card = document.createElement('div');
    card.className = 'duel-card duel-card-enter';
    card.innerHTML = renderPickupCard(ev);
    card.addEventListener('click', () => choosePickupOption(ev));
    stage.appendChild(card);
  });
}

function choosePickupOption(ev){
  hideCoachmark();
  duelPickup.sessionPicks.push(ev);
  duelPickup.round += 1;
  renderPickupRound();
}

// PC向け: マウスホイールの縦スクロールを横送りに変換し、ドラッグでも横送りできるようにする
(function enableDesktopHorizontalScroll(el){
  el.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    el.scrollLeft += e.deltaY;
    e.preventDefault();
  }, { passive: false });

  let dragging = false, startX = 0, startScrollLeft = 0, moved = false;
  el.addEventListener('mousedown', (e) => {
    dragging = true; moved = false;
    startX = e.clientX;
    startScrollLeft = el.scrollLeft;
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 4) moved = true;
    el.scrollLeft = startScrollLeft - dx;
  });
  window.addEventListener('mouseup', () => { dragging = false; });
  // ドラッグでカードが動いた直後は、離した時のclickでカード選択が誤発火しないようにする
  el.addEventListener('click', (e) => { if (moved) e.stopPropagation(); }, true);
})(document.getElementById('pickupStage'));

/* ==================================================================
   Screen 4/5 — クイズフェーズ（service_design_document.md 10章）
   ================================================================== */
let quizPatterns = null;
let orderEvents = null;
let bodyPoints = null; // 4-5節の身体部位マッピング（50箇所、10年刻み）

async function loadQuizData(){
  if (quizPatterns && orderEvents && bodyPoints) return;
  const [patternsRes, orderRes, bodyPointsRes] = await Promise.all([
    fetch('data/quiz/patterns.json'),
    fetch('data/quiz/order_events.json'),
    fetch('data/quiz/body_points.json')
  ]);
  quizPatterns = await patternsRes.json();
  orderEvents = await orderRes.json();
  bodyPoints = await bodyPointsRes.json();
}

function choiceCountFor(heldCount){
  const rules = quizPatterns.config.choiceCountRules;
  for (const r of rules){
    if (heldCount >= r.minHeldCount && (r.maxHeldCount === null || heldCount <= r.maxHeldCount)){
      return Math.min(r.choiceCount, heldCount);
    }
  }
  return Math.min(4, heldCount);
}

function pickRandom(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}

// 10年刻みの身体部位マッピング（4-5節）上で、西暦に最も近いポイントの年を返す。
// 1995〜1999年は2000年（=1500年の頭頂部と同一地点）に丸まるため、1500年に読み替える。
function checkpointYear(year){
  let cp = Math.round(year / 10) * 10;
  if (cp >= 2000) cp = 1500;
  return cp;
}
function yearRangeLabel(year){
  const cp = checkpointYear(year);
  return `${cp - 5}〜${cp + 5}年`;
}
function iconLabelFor(ev){
  return `${ev.icon} ${iconItemLabel(ev)}`;
}
function fieldValue(item, field){
  switch (field){
    case 'year': return `${item.year}年`;
    case 'title': return item.title;
    case 'bodyPart': return item.bodyPart;
    case 'iconLabel': return iconLabelFor(item);
    case 'yearRange': return yearRangeLabel(item.year);
    case 'label': return item.label; // body_pointsのラベルそのもの
    default: return item[field];
  }
}

// 体の部位・年代を答えさせる問題は、隣接ポイントと混同しやすいので、候補同士の
// 西暦が最低でも指定年数（既定20年）以上離れるよう、貪欲法で候補を選ぶ。
// target は必ず1件目に含む。
function pickYearSeparated(candidates, target, minSep, count){
  const chosen = [target];
  const pool = shuffle(candidates);
  for (const c of pool){
    if (chosen.length >= count) break;
    if (chosen.every(ch => Math.abs(ch.year - c.year) >= minSep)) chosen.push(c);
  }
  return chosen;
}

const STANDARD_PATTERN_IDS = [
  'icon_to_year', 'person_to_year', 'year_to_person', 'year_to_icon',
  'bodypart_to_icon', 'icon_to_bodypart', 'person_to_bodypart',
  'bodypart_to_person', 'bodypart_to_yearrange', 'yearrange_to_bodypart',
  'icon_order'
];

// arrの全順列を返す（3件程度の小さな配列専用）
function permutations(arr){
  if (arr.length <= 1) return [arr];
  const result = [];
  arr.forEach((item, i) => {
    const rest = arr.slice(0, i).concat(arr.slice(i + 1));
    permutations(rest).forEach(p => result.push([item, ...p]));
  });
  return result;
}

// 保有出来事から3件選び、活躍年の正しい並び順を3択（正解1＋誤答2）で問う
function buildIconOrderQuestion(held){
  const picks = shuffle(held).slice(0, 3);
  const correctIcons = [...picks].sort((a, b) => a.year - b.year).map(e => e.icon);
  const correctKey = correctIcons.join('→');

  const allOrders = permutations(picks.map(e => e.icon));
  const wrongOrders = shuffle(allOrders.filter(o => o.join('→') !== correctKey)).slice(0, 2);

  const optionOrders = shuffle([correctIcons, ...wrongOrders]);
  const choices = optionOrders.map(o => o.join(' → '));
  const correctIndex = optionOrders.findIndex(o => o.join('→') === correctKey);

  const prompt = `${picks.map(e => e.icon).join('、')}の人物が活躍した年の順番は？`;
  return { prompt, choices, correctIndex };
}

// ヒント文言（2026-09-25追加）：回答に使う4つの情報（偉人名・ゆかりのもの・
// 体の部位・年号）のうち、その設問の「問い」にも「答え」にも使われていない
// 残り2つを使って文章を組み立てる（答えそのものを言い当ててしまう情報は
// 決して含めない）。対象は9-2-2節の4項目に基づく偉人型の設問のみで、前後
// 関係・並び替え・5問目（出来事の体の部位）にはヒントを用意しない。
const HINT_BUILDERS = {
  icon_to_year:          t => `${t.title}の${t.bodyPart}のことだね`,
  year_to_icon:          t => `${t.title}の${t.bodyPart}のことだね`,
  person_to_year:        t => `ゆかりのものは${iconItemLabel(t)}。${t.bodyPart}あたりのことだね`,
  year_to_person:        t => `ゆかりのものは${iconItemLabel(t)}。${t.bodyPart}あたりのことだね`,
  bodypart_to_icon:      t => `${t.bodyPart}は${t.year}年${t.title}の頃だね`,
  icon_to_bodypart:      t => `${iconItemLabel(t)}は${t.year}年${t.title}の頃だね`,
  person_to_bodypart:    t => `ゆかりのものは${iconItemLabel(t)}。${t.year}年のことだね`,
  bodypart_to_person:    t => `ゆかりのものは${iconItemLabel(t)}。${t.year}年のことだね`,
  bodypart_to_yearrange: t => `${t.title}のゆかりのものは${iconItemLabel(t)}だね`,
  yearrange_to_bodypart: t => `${t.title}のゆかりのものは${iconItemLabel(t)}だね`,
};
function hintTextFor(patternId, target){
  const build = HINT_BUILDERS[patternId];
  return build ? build(target) : null;
}

function promptTextFor(pattern, target){
  return pattern.questionTemplate
    .replace('{{icon}}', target.icon)
    .replace('{{title}}', target.title)
    .replace('{{year}}', target.year)
    .replace('{{bodyPart}}', target.bodyPart)
    .replace('{{iconLabel}}', iconLabelFor(target))
    .replace('{{yearRange}}', yearRangeLabel(target.year));
}

function buildStandardQuestion(held){
  const patternId = pickRandom(STANDARD_PATTERN_IDS);
  if (patternId === 'icon_order') return buildIconOrderQuestion(held);

  const pattern = quizPatterns.patterns.find(p => p.id === patternId);
  const target = pickRandom(held);
  const n = choiceCountFor(held.length);
  const others = held.filter(e => e.id !== target.id);

  const chosen = pattern.requiresBodyPartSeparation
    ? pickYearSeparated(others, target, quizPatterns.config.bodyPartMinSeparationYears, n)
    : [target, ...shuffle(others).slice(0, n - 1)];

  const shuffled = shuffle(chosen);
  const choices = shuffled.map(e => fieldValue(e, pattern.answerField));
  const correctIndex = shuffled.findIndex(e => e.id === target.id);

  return { prompt: promptTextFor(pattern, target), choices, correctIndex, hint: hintTextFor(patternId, target) };
}

function buildEventLocationQuestion(){
  const pattern = quizPatterns.patterns.find(p => p.id === 'event_location');
  const staticEv = pickRandom(orderEvents);
  const correctYear = checkpointYear(staticEv.year);
  const correctPoint = bodyPoints.find(p => p.year === correctYear);
  const others = bodyPoints.filter(p => p.year !== correctPoint.year);

  const n = 4; // 50箇所の全体から選ぶため、保有件数に関わらず標準の4択
  const chosen = pickYearSeparated(others, correctPoint, quizPatterns.config.bodyPartMinSeparationYears, n);
  const shuffled = shuffle(chosen);
  const choices = shuffled.map(p => fieldValue(p, pattern.answerField));
  const correctIndex = shuffled.findIndex(p => p.year === correctPoint.year);

  const prompt = pattern.questionTemplate
    .replace('{{staticYear}}', staticEv.year)
    .replace('{{staticHeadline}}', staticEv.headline);

  return { prompt, choices, correctIndex };
}

function buildQuizQuestions(held){
  const questions = [];
  for (let i = 0; i < 4; i++) questions.push(buildStandardQuestion(held));
  questions.push(buildEventLocationQuestion());
  return questions;
}

let quizState = { questions: [], index: 0, correctCount: 0 };

async function startQuiz(){
  await loadQuizData();
  quizState = { questions: buildQuizQuestions(ringEventsCache), index: 0, correctCount: 0 };
  showScreen('screen-quiz');
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const q = quizState.questions[quizState.index];

  document.getElementById('quizEyebrow').textContent = `${quizState.index + 1} / ${quizState.questions.length}`;

  const dots = document.getElementById('quizDots');
  dots.innerHTML = '';
  quizState.questions.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i < quizState.index ? ' filled' : i === quizState.index ? ' current' : '');
    dots.appendChild(d);
  });

  const stage = document.getElementById('quizStage');
  stage.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'quiz-card quiz-card-enter';
  const prompt = document.createElement('div');
  prompt.className = 'quiz-prompt';
  prompt.textContent = q.prompt;
  card.appendChild(prompt);

  if (q.hint){
    const hintBtn = document.createElement('button');
    hintBtn.className = 'quiz-hint-btn tech';
    hintBtn.innerHTML = 'ヒント <span class="quiz-hint-arrow">▼</span>';
    const hintPanel = document.createElement('div');
    hintPanel.className = 'quiz-hint-panel';
    const hintText = document.createElement('div');
    hintText.className = 'quiz-hint-text';
    hintText.textContent = q.hint;
    hintPanel.appendChild(hintText);
    hintBtn.addEventListener('click', () => {
      hintBtn.classList.toggle('open');
      hintPanel.classList.toggle('open');
    });
    card.appendChild(hintBtn);
    card.appendChild(hintPanel);
  }

  stage.appendChild(card);

  const choicesWrap = document.getElementById('quizChoices');
  choicesWrap.innerHTML = '';
  q.choices.forEach((choiceText, i) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-choice-btn tech';
    btn.textContent = choiceText;
    btn.addEventListener('click', () => answerQuiz(i));
    choicesWrap.appendChild(btn);
  });
}

function answerQuiz(answer){
  const q = quizState.questions[quizState.index];
  const isCorrect = answer === q.correctIndex;
  if (isCorrect) quizState.correctCount += 1;

  if (quizState.index < quizState.questions.length - 1){
    quizState.index += 1;
    renderQuizQuestion();
  } else {
    showScreen('screen-quiz-result');
    animateQuizResult(quizState.correctCount, quizState.questions.length);
  }
}

function spawnResultParticles(container){
  for (let i = 0; i < 10; i++){
    const p = document.createElement('span');
    p.className = 'quiz-result-particle';
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 40;
    p.style.setProperty('--px', `${Math.cos(angle) * dist}px`);
    p.style.setProperty('--py', `${Math.sin(angle) * dist}px`);
    container.appendChild(p);
    requestAnimationFrame(() => p.classList.add('burst'));
    setTimeout(() => p.remove(), 1000);
  }
}

function animateQuizResult(score, total){
  const passed = score >= quizPatterns.config.passThreshold;
  const levelEl = document.getElementById('quizResultLevel');
  const scoreEl = document.getElementById('quizResultScore');
  const titleEl = document.getElementById('quizResultTitle');
  const noteEl = document.getElementById('quizResultNote');
  const cardEl = document.getElementById('quizResultCard');
  const continueBtn = document.getElementById('quizResultContinueBtn');

  cardEl.classList.remove('pass', 'fail', 'revealed');
  levelEl.textContent = '';
  titleEl.textContent = '';
  noteEl.textContent = '';
  continueBtn.style.display = 'none';
  scoreEl.textContent = `0 / ${total}`;

  const oldLevel = playerLevel;
  const oldCap = getLevelInfo(oldLevel).cap;

  if (passed) playerLevel = Math.min(playerLevel + 1, LEVEL_TABLE.length);
  savePlayerLevel();
  const info = getLevelInfo(playerLevel);
  const unlockCount = info.cap - oldCap;

  let current = 0;
  const timer = setInterval(() => {
    current += 1;
    scoreEl.textContent = `${current} / ${total}`;
    if (current >= score){
      clearInterval(timer);
      setTimeout(() => {
        cardEl.classList.add(passed ? 'pass' : 'fail', 'revealed');
        levelEl.textContent = passed ? `Lv.${oldLevel} クリア！` : 'ざんねん！';
        titleEl.innerHTML = passed
          ? `あなたは<strong>${info.title}</strong>になった`
          : `あなたは<strong>${info.title}</strong>のままだ`;
        if (passed && unlockCount > 0){
          noteEl.textContent = `記憶できる歴史が、あと${unlockCount}つ解放されました！`;
        } else if (!passed){
          const need = quizPatterns.config.passThreshold;
          noteEl.textContent = `${total}問中${need}問以上正解するとクリアだよ。つぎはがんばろう！`;
        }
        continueBtn.style.display = '';
        if (passed) spawnResultParticles(cardEl);
      }, 200);
    }
  }, 150);
}

document.getElementById('quizResultContinueBtn').addEventListener('click', async () => {
  showScreen('screen-ring');
  await renderRing();
});

   shared — event detail sheet
   ================================================================== */
const sheet = document.getElementById('sheet');
const scrim = document.getElementById('scrim');
let activeEventId = null;

function openDetailSheet(ev){
  hideCoachmark();
  activeEventId = ev.id;
  const isGreatman = ev.counterfactual !== undefined;
  document.getElementById('detailYear').textContent = ev.year + '年';
  document.getElementById('detailPerson').style.display = isGreatman ? 'flex' : 'none';
  document.getElementById('detailRelic').style.display = isGreatman ? '' : 'none';
  document.getElementById('detailMnemonic').style.display = isGreatman ? '' : 'none';
  document.getElementById('detailTeaser').style.display = isGreatman ? 'none' : '';
  const portraitEl = document.getElementById('detailPortrait');
  if (isGreatman){
    document.getElementById('detailPersonName').textContent = ev.fullName || ev.title;
    document.getElementById('detailRelic').textContent = `ゆかりのもの：${ev.icon || ''} ${iconItemLabel(ev)}`;
    document.getElementById('detailMnemonic').textContent = ev.mnemonicImage || '';
  } else {
    document.getElementById('detailTeaser').textContent = ev.teaser;
  }
  if (isGreatman && ev.portrait){
    portraitEl.src = ev.portrait;
    portraitEl.alt = ev.title;
    portraitEl.style.display = 'block';
  } else {
    portraitEl.style.display = 'none';
  }
  document.getElementById('detailPlace').textContent = ev.place;
  document.getElementById('detailBody').innerHTML = (ev.counterfactual !== undefined) ? `
    <p><span class="tag">何をした人か</span>${ev.whatTheyDid}</p>
    <p><span class="tag">詳細</span>${ev.factLayer}</p>
    <p><span class="tag">Before</span>${ev.before}</p>
    <p><span class="tag">After</span>${ev.after}</p>
  ` : `
    <p><span class="tag">事実レイヤー</span>${ev.factLayer}</p>
    <p><span class="tag">具体的なマテリアル</span>${ev.material}</p>
    <p><span class="tag">体感レイヤー</span>${ev.sensation}</p>
    <p><span class="tag">選定理由</span>${ev.rationale}</p>
  `;

  svg.querySelectorAll('.node-dot').forEach(d => d.classList.remove('active'));
  svg.querySelectorAll('.node-glow').forEach(g => g.classList.remove('active'));
  const dot = svg.querySelector(`.node-dot[data-id="${ev.id}"]`);
  const glow = svg.querySelector(`.node-glow[data-id="${ev.id}"]`);
  if (dot){ dot.classList.add('active'); dot.classList.add('visited'); }
  if (glow) glow.classList.add('active');

  sheet.classList.add('open');
  scrim.classList.add('show');
}

function closeSheet(){
  sheet.classList.remove('open');
  scrim.classList.remove('show');
  if (activeEventId){
    const glow = svg.querySelector(`.node-glow[data-id="${activeEventId}"]`);
    const dot = svg.querySelector(`.node-dot[data-id="${activeEventId}"]`);
    if (glow) glow.classList.remove('active');
    if (dot) dot.classList.remove('active');
  }
  activeEventId = null;
}
scrim.addEventListener('click', closeSheet);

document.getElementById('deleteBtn').addEventListener('click', () => {
  if (!activeEventId) return;
  ringList = ringList.filter(r => r.id !== activeEventId);
  saveRingList();
  closeSheet();
  renderRing();
});
